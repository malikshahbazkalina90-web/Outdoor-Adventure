<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon.png">
<title>Outdoor Adventure</title>
<style>
    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: #f2f4f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .thankyou-container {
        text-align: center;
        background: #fff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        max-width: 600px;
        width: 90%;
    }
    .thankyou-container img {
        max-width: 100%;
        border-radius: 12px;
        margin-bottom: 30px;
    }
    .thankyou-container h1 {
        font-size: 32px;
        color: #333;
        margin-bottom: 15px;
    }
    .thankyou-container p {
        font-size: 18px;
        color: #555;
        margin-bottom: 25px;
    }
    .thankyou-container a {
        text-decoration: none;
        padding: 12px 25px;
        background: linear-gradient(to right, #ff7a00, #fb2056);
        color: white;
        border-radius: 8px;
        font-weight: 600;
        transition: 0.3s;
    }
    .thankyou-container a:hover {
        opacity: 0.9;
    }
</style>
</head>
<body>

<div class="thankyou-container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Eo_circle_green_checkmark.svg/500px-Eo_circle_green_checkmark.svg.png" alt="Thank You" style="height: 200px; width: 200px;">
    <h1>Thank You for Booking!</h1>
    <p>Your trip has been successfully booked. We’ll send you a confirmation email shortly with all the details.</p>
    <a href="index.html">Back to Home</a>
</div>

</body>
</html>
